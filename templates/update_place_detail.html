<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Place Detail</title>
</head>
<body>
<h2>Edit Place Details</h2>

<form id="place-form">
    <label>Name: <input type="text" id="name"></label><br><br>
    <label>Description: <textarea id="description"></textarea></label><br><br>
    <label>Address: <input type="text" id="address"></label><br><br>
    <label>Price per Night: <input type="number" id="price_per_night" step="0.01"></label><br><br>
    <label>Booking Active:
        <select id="is_active">
            <option value="true">Yes</option>
            <option value="false">No</option>
        </select>
    </label>
    <button id="delete-button" style="background: red; color: white;">Delete Place</button>
    <br><br>

    <button type="submit">Update</button>
</form>

<p id="message"></p>

<script>
    const token = localStorage.getItem('access_token');
    const pathParts = window.location.pathname.split('/').filter(Boolean);
    const placeId = pathParts[pathParts.length - 2];  // Get the second-last part
    const API_URL = `/api/places/${placeId}/`;

    // Fetch place details
    window.onload = function () {
        fetch(API_URL, {
            headers: {
                'Authorization': `Bearer ${token}`,
                'Content-Type': 'application/json'
            }
        })
            .then(res => res.json())
            .then(data => {
                document.getElementById('name').value = data.name;
                document.getElementById('description').value = data.description;
                document.getElementById('address').value = data.address;
                document.getElementById('price_per_night').value = data.price_per_night;
                document.getElementById('is_active').value = data.is_active ? 'true' : 'false';
            });
    };

    // Submit updates
    document.getElementById('place-form').addEventListener('submit', function (e) {
        e.preventDefault();

        const payload = {
            name: document.getElementById('name').value,
            description: document.getElementById('description').value,
            address: document.getElementById('address').value,
            price_per_night: parseFloat(document.getElementById('price_per_night').value),
            is_active: document.getElementById('is_active').value === 'true'
        };

        fetch(API_URL, {
            method: 'PUT',
            headers: {
                'Authorization': `Bearer ${token}`,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(payload)
        })
            .then(res => {
                if (!res.ok) throw new Error("Failed to update place.");
                return res.json();
            })
            .then(data => {
                document.getElementById('message').textContent = "Place updated successfully!";
            })
            .catch(err => {
                document.getElementById('message').textContent = "Error updating place.";
                console.error(err);
            });
    });
    document.getElementById('delete-button').addEventListener('click', function () {
        if (confirm("Are you sure you want to delete this place?")) {
            fetch(API_URL, {
                method: 'DELETE',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                }
            })
                .then(res => {
                    if (!res.ok) throw new Error("Delete failed");
                    alert("Place deleted successfully!");
                    window.location.href = "/profile/";  // redirect back to profile
                })
                .catch(err => {
                    console.error(err);
                    alert("Place could not be deleted. It might have paid bookings.");
                });
        }
    });

</script>

</body>
</html>
