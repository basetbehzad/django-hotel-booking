<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Payment Success</title>
    <meta http-equiv="refresh" content="5; url={{ reservation_detail_url }}">
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
        }
        .container {
            max-width: 600px;
            margin: auto;
        }
        .checkmark {
            font-size: 60px;
            color: green;
        }
        .message {
            font-size: 24px;
            margin-top: 20px;
        }
        .countdown {
            font-size: 18px;
            margin: 20px 0;
            color: #666;
        }
        a.button {
            display: inline-block;
            margin: 10px;
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
        a.button.secondary {
            background-color: #2196F3;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="checkmark">✅</div>
        <div class="message">Payment completed successfully!</div>
        <p>Your booking #{{ booking_id }} has been confirmed and marked as paid.</p>

        <div class="countdown">
            Redirecting to reservation details in <span id="countdown">5</span> seconds...
        </div>

        <div>
            <a href="{{ reservation_detail_url }}" class="button">View Reservation Now</a>
            <a href="/dashboard/" class="button secondary">Back to Dashboard</a>
        </div>
    </div>

    <script>
        // Countdown timer
        let seconds = 5;
        const countdownElement = document.getElementById('countdown');

        const countdown = setInterval(() => {
            seconds--;
            countdownElement.textContent = seconds;

            if (seconds <= 0) {
                clearInterval(countdown);
            }
        }, 1000);

        // Optional: If you want to use the API approach instead of meta refresh
        // window.setTimeout(() => {
        //     window.location.href = "{{ reservation_detail_url }}";
        // }, 5000);
    </script>
</body>
</html>
